line-length = 130
target-version = "py311"

[lint]
# Errors that matter: pyflakes (unused imports, undefined names), pycodestyle errors, bare except (E722),
# bugbear (likely bugs), import order. Style-only rule sets are intentionally off.
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "B008"]  # long data lines are fine; FastAPI's Depends() in defaults is idiomatic

[lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # env must be set before importing the app
